spring.application.name=LifeProject

server.port=80

spring.datasource.url=jdbc:oracle:thin:@43.202.181.12:1521/XEPDB1
spring.datasource.username=life_project
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

jwt.expiration=10800000
jwt.secret=${JWT_SECRET:local-dev-secret-key-must-be-over-32-bytes!!}

mybatis.mapper-locations=classpath:mappers/*-mapper.xml
mybatis.configuration.map-underscore-to-camel-case=true

spring.servlet.multipart.max-file-size = 10MB
spring.servlet.multipart.max-request-size = 50MB

gcp.credentials.location=classpath:project-d711b788-591a-4eb0-b62-513e70dc5429.json
gcp.project.id=project-d711b788-591a-4eb0-b62

spring.config.import=optional:classpath:application-secret.properties
spring.ai.google.genai.api-key=${GEMINI_API_KEY:dummy-key}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
# AI 호출이 한도(429)에 걸리면 Spring AI 가 혼자 다시 시도하지 않게: 이야기·묻기(AiCaller)가 바로 예비 모델로 넘어감 (11/25)
spring.ai.retry.max-attempts=1

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

narrate.enabled=true